name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fails if any displayed text is not present in docs/toolkit/.
      # This is the check that keeps invariant 1 true. See CLAUDE.md section 1.
      - name: Verify toolkit quotes
        run: npm run verify:quotes

      - name: Build
        run: npm run build

      # The single-file build is the artefact people are handed on a USB drive.
      # 05-file-protocol.spec.ts needs it present.
      - name: Build offline
        run: npm run build:offline

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:chromium
